name: Build Executable

on:
  push:
    tags:
      - 'v*' # Executa automaticamente ao criar uma tag de versão (ex: v1.0.0)
  workflow_dispatch: # Permite rodar o processo manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: windows-latest # Gera o executável (.exe) para Windows

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências e PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Gerar o Executável
      run: |
        pyinstaller --onefile --noconsole main.py
        # Nota:
        # --onefile: Junta tudo em um único arquivo .exe
        # --noconsole: Oculta a janela preta do terminal (remova esta opção se o seu programa for de linha de comando)

    - name: Publicar Executável na Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/main.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}